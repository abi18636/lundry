services:
  - type: web
    name: zenith-trader-bot
    runtime: python
    plan: free
    buildCommand: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; find . -name "*.pyc" -delete 2>/dev/null; find /opt -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; find /opt -name "*.pyc" -delete 2>/dev/null; pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: ARIAX_BASE_URL
        value: https://dryclean-app-1.onrender.com
      - key: ARIAX_FALLBACK_URL
        value: https://dryclean-app-1.onrender.com
      - key: ARIAX_API_KEY
        value: arx-karoon177-fixed-9d4e7c1a
      - key: ARIAX_API_SECRET
        value: Kf9mWx2vQz7RtN4pZb8LhY3jT6sEgUa5cHn1oPzIkM0yBvVXe
      - key: TRADING_ENABLED
        value: "true"
      - key: DRY_RUN
        value: "false"
      - key: CAPITAL_USD
        value: "400"
      - key: LEV_CAP
        value: "5"
      - key: LONG_ONLY
        value: "false"
      - key: ASSETS
        value: BTC,ETH,SOL,AVAX,LINK,XRP,DOGE,ADA,DOT,LTC
      - key: SLEEVE_WEIGHTS
        value: "diversified_5:0.15,zenith_apex:0.15,almasi_primary:0.15,inst_v3_stable:0.15,inst_v3_primary:0.10,zenith_endurance:0.10,mean_reversion:0.20"
      - key: SLEEVES_ENABLED
        value: "diversified_5,zenith_apex,almasi_primary,inst_v3_stable,inst_v3_primary,zenith_endurance,mean_reversion"
      - key: LOOP_SECONDS
        value: "90"
      - key: MAX_NOTIONAL_USD
        value: "400"
      - key: MIN_NOTIONAL_USD
        value: "5"
      - key: CANDLE_LOOKBACK_HOURS
        value: "1000"
      - key: REBALANCE_NOTIONAL_USD
        value: "25"
      - key: TRADE_ON_CANDLE_CLOSE_ONLY
        value: "true"
      - key: MARKET_DATA_MAX_AGE_SECONDS
        value: "180"
      - key: MAX_SPREAD_BPS
        value: "200"
      - key: MAX_SLIPPAGE_BPS
        value: "100"
      - key: MAX_DRAWDOWN_PCT
        value: "0.15"
      - key: TEST_TRADE_ENABLED
        value: "true"
      - key: TEST_TRADE_ASSET
        value: "BTC"
      - key: TEST_TRADE_HOLD_SECONDS
        value: "60"
      - key: TEST_TRADE_MAX_NOTIONAL_USD
        value: "10"
      - key: TELEGRAM_BOT_USERNAME
        value: "TestTraid_bot"
      - key: TELEGRAM_ENABLED
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
