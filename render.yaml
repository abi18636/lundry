services:
  - type: web
    name: zenith-trader-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ARIAX_BASE_URL
        value: https://dryclean-app-1.onrender.com
      - key: ARIAX_FALLBACK_URL
        value: https://dryclean-app-1.onrender.com
      - key: ARIAX_API_KEY
        value: arx-karoon177-fixed-9d4e7c1a
      - key: ARIAX_API_SECRET
        value: Kf9mWx2vQz7RtN4pZb8LhY3jT6sEgUa5cHn1oPzIkM0yBvVXe
      - key: TRADING_ENABLED
        value: "true"
      - key: DRY_RUN
        value: "false"
      - key: CAPITAL_USD
        value: "200"
      - key: LEV_CAP
        value: "5.0"
      - key: LONG_ONLY
        value: "false"
      - key: ASSETS
        value: BTC,ETH,SOL,AVAX,LINK
      - key: SLEEVE_WEIGHTS
        value: "diversified_5:0.50,zenith_apex:0.15,almasi_primary:0.15,inst_v3_stable:0.10,inst_v3_primary:0.05,zenith_endurance:0.05"
      - key: SLEEVES_ENABLED
        value: "diversified_5,zenith_apex,almasi_primary,inst_v3_stable,inst_v3_primary,zenith_endurance"
      - key: LOOP_SECONDS
        value: "60"
      - key: MAX_NOTIONAL_USD
        value: "400"
      - key: MIN_NOTIONAL_USD
        value: "10"
      - key: CANDLE_LOOKBACK_HOURS
        value: "1000"
      - key: TELEGRAM_TRADE_ONLY
        value: "true"
      - key: TELEGRAM_FULL_REPORT_HOURS
        value: "6"
      - key: REBALANCE_NOTIONAL_USD
        value: "1.0"
      - key: MARKET_DATA_MAX_AGE_SECONDS
        value: "180"
      - key: MAX_SPREAD_BPS
        value: "200"
      - key: MAX_SLIPPAGE_BPS
        value: "100"
      - key: MAX_DRAWDOWN_PCT
        value: "0.15"
      - key: OPS_REVIEW_SECONDS
        value: "3600"
      - key: ALLOW_MAINNET_TRADING
        value: "false"
      - key: DASHBOARD_TOKEN
        sync: false
      - key: REPORT_TIMEZONE
        value: "Europe/Istanbul"
      - key: REPORT_HISTORY_HOURS
        value: "168"
      - key: TEST_TRADE_ENABLED
        value: "false"
      - key: TEST_TRADE_ASSET
        value: "BTC"
      - key: TEST_TRADE_HOLD_SECONDS
        value: "60"
      - key: TEST_TRADE_MAX_NOTIONAL_USD
        value: "10"
      - key: TELEGRAM_BOT_USERNAME
        value: "TestTraid_bot"
      - key: TELEGRAM_ENABLED
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
